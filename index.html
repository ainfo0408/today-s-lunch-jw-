<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자운고등학교 오늘의 급식</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>자운고등학교 급식</h1>
            <input type="date" id="date-picker" class="date-picker">
        </header>

        <main class="content">
            <div id="loader" class="loader">
                <div class="spinner"></div>
                <p>오늘의 메뉴를 준비하고 있어요...</p>
            </div>

            <div id="meal-container" class="meal-container hidden">
                <div class="menu-card" style="margin-top: 20px;">
                    <div class="card-header">
                        <h2>오늘의 식단</h2>
                        <span id="calories-display" class="calories">0 Kcal</span>
                    </div>
                    <ul id="menu-list" class="menu-list">
                        <!-- 메뉴 항목들이 여기에 추가됩니다. -->
                    </ul>
                </div>
            </div>

            <div id="error-container" class="error-container hidden">
                <div class="icon">😭</div>
                <p id="error-message">오늘은 급식이 없거나 정보를 불러올 수 없어요.</p>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
